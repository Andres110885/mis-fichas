<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6366f1" />
<title>Mis Fichas de Estudio</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f7;
    --card:#ffffff;
    --ink:#131627;
    --ink-soft:#3d4256;
    --muted:#767c92;
    --line:#e6e8f1;
    --line-2:#eef0f6;
    --accent:#6366f1;
    --shadow-sm:0 1px 2px rgba(20,23,40,.06);
    --shadow:0 10px 30px -12px rgba(30,34,60,.28);
    --shadow-lg:0 22px 48px -18px rgba(30,34,60,.42);
    --radius:22px;
    --radius-sm:15px;
    --display:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0d15; --card:#161a26; --ink:#f2f3fa; --ink-soft:#c7cbdb;
      --muted:#8b91a7; --line:#252a3a; --line-2:#1e2331;
      --shadow:0 14px 34px -12px rgba(0,0,0,.6);
      --shadow-lg:0 26px 56px -18px rgba(0,0,0,.72);
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--body); color:var(--ink);
    background:var(--bg);
    -webkit-font-smoothing:antialiased; line-height:1.45;
    min-height:100vh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 10px);
    position:relative; overflow-x:hidden;
  }
  /* Fondo con manchas de color suaves */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(48% 34% at 8% 0%, rgba(99,102,241,.20), transparent 60%),
      radial-gradient(42% 30% at 100% 6%, rgba(236,72,153,.16), transparent 60%),
      radial-gradient(50% 40% at 50% 100%, rgba(14,165,233,.14), transparent 62%);
  }
  @media (prefers-color-scheme: dark){
    body::before{
      background:
        radial-gradient(50% 36% at 6% 0%, rgba(99,102,241,.26), transparent 60%),
        radial-gradient(44% 30% at 100% 4%, rgba(236,72,153,.18), transparent 60%),
        radial-gradient(52% 42% at 50% 100%, rgba(14,165,233,.16), transparent 62%);
    }
  }
  .wrap{max-width:1060px; margin:0 auto; padding:0 18px}
  ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:30;
    padding:calc(env(safe-area-inset-top) + 14px) 0 14px;
    background:color-mix(in srgb,var(--bg) 78%, transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  }
  .brand{display:flex; align-items:center; gap:13px}
  .brand-txt{min-width:0}
  .add-btn{margin-left:auto;flex:0 0 auto;border:none;cursor:pointer;
    font-family:var(--display);font-weight:700;font-size:13.5px;color:#fff;
    background:linear-gradient(140deg,#6366f1,#8b5cf6);
    padding:11px 15px;border-radius:13px;display:flex;align-items:center;gap:7px;
    box-shadow:0 8px 18px -6px rgba(99,102,241,.6);transition:transform .14s}
  .add-btn:active{transform:scale(.95)}
  .add-btn:hover{filter:brightness(1.06)}
  @media (max-width:440px){ .add-btn span{display:none} .add-btn{padding:11px 13px} }
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(140deg,#6366f1,#a855f7 55%,#ec4899);
    display:grid;place-items:center;font-size:23px;
    box-shadow:0 8px 20px -6px rgba(99,102,241,.65), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand h1{font-family:var(--display);font-size:20px;margin:0;font-weight:800;
    letter-spacing:-.03em;line-height:1.1}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
  .search{position:relative;margin-top:14px}
  .search input{
    width:100%;padding:14px 16px 14px 44px;border-radius:15px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-family:var(--body);font-size:15.5px;outline:none;
    box-shadow:var(--shadow-sm);
    transition:border-color .16s, box-shadow .16s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--accent);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
  .search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);
    width:19px;height:19px;color:var(--muted)}
  .search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    border:none;background:var(--line-2);color:var(--muted);width:28px;height:28px;
    border-radius:9px;cursor:pointer;display:none;place-items:center;font-size:15px}
  .search .clear.show{display:grid}

  /* ---------- Breadcrumb ---------- */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;
    font-size:13px;color:var(--muted);margin:18px 0 2px;font-weight:500}
  .crumbs button{background:none;border:none;color:var(--muted);
    font-family:var(--body);font-size:13px;cursor:pointer;padding:4px 8px;border-radius:9px}
  .crumbs button:hover{background:var(--card);color:var(--ink)}
  .crumbs .cur{color:var(--ink);font-weight:700;padding:4px 8px}
  .crumbs .sep{opacity:.45;padding:0 1px}

  .section-label{font-family:var(--display);font-size:12.5px;font-weight:700;
    letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
    margin:24px 4px 13px;display:flex;align-items:center;gap:8px}
  .count-pill{font-family:var(--body);font-size:11px;font-weight:700;
    background:var(--card);color:var(--muted);border:1px solid var(--line);
    border-radius:20px;padding:2px 9px;line-height:1.5}

  /* ---------- Grids ---------- */
  .grid{display:grid;gap:15px}
  .grid.themes{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
  .grid.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .grid > *{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
  .grid > *:nth-child(2){animation-delay:.03s}
  .grid > *:nth-child(3){animation-delay:.06s}
  .grid > *:nth-child(4){animation-delay:.09s}
  .grid > *:nth-child(5){animation-delay:.12s}
  .grid > *:nth-child(n+6){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- Tarjeta de tema / carpeta ---------- */
  .tile{
    position:relative;border:none;text-align:left;cursor:pointer;font-family:var(--body);
    border-radius:var(--radius);padding:17px;color:#fff;overflow:hidden;
    min-height:158px;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:var(--shadow);
    transition:transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .16s;
    isolation:isolate;
  }
  .tile::after{ /* brillo diagonal */
    content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(150deg,rgba(255,255,255,.22),transparent 42%);
  }
  .tile .blob{position:absolute;border-radius:50%;
    background:rgba(255,255,255,.14);z-index:-1;filter:blur(2px)}
  .tile .blob.b1{width:130px;height:130px;right:-38px;top:-42px}
  .tile .blob.b2{width:90px;height:90px;right:14px;bottom:-46px;background:rgba(255,255,255,.10)}
  .tile:active{transform:scale(.975)}
  .tile:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .tile .mono{width:44px;height:44px;border-radius:13px;
    background:rgba(255,255,255,.24);backdrop-filter:blur(4px);
    display:grid;place-items:center;font-family:var(--display);
    font-weight:800;font-size:21px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .tile .t-name{font-family:var(--display);font-size:18px;font-weight:800;
    letter-spacing:-.02em;margin-top:10px;line-height:1.15;
    text-shadow:0 1px 8px rgba(0,0,0,.12)}
  .tile .t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .tile .t-chip{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.22);
    padding:3px 9px;border-radius:20px;backdrop-filter:blur(3px)}
  .tile .chev{position:absolute;top:18px;right:16px;opacity:.85}

  /* ---------- Tarjeta de ficha ---------- */
  .ficha{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius-sm);padding:0;cursor:pointer;box-shadow:var(--shadow-sm);
    display:flex;gap:0;align-items:stretch;overflow:hidden;font-family:var(--body);
    transition:transform .15s cubic-bezier(.2,.7,.2,1), box-shadow .15s, border-color .15s;
  }
  .ficha:active{transform:scale(.985)}
  .ficha:hover{box-shadow:var(--shadow);transform:translateY(-2px);
    border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .ficha .ic{width:58px;flex:0 0 auto;display:grid;place-items:center;color:#fff;
    font-size:21px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000 8%));
    position:relative}
  .ficha .ic svg{width:24px;height:24px}
  .ficha .body{padding:14px 14px 14px 15px;min-width:0;flex:1;
    display:flex;flex-direction:column;justify-content:center}
  .ficha .f-title{font-family:var(--display);font-size:15.5px;font-weight:700;
    letter-spacing:-.01em;color:var(--ink);line-height:1.25}
  .ficha .f-sub{display:inline-flex;align-items:center;gap:5px;margin-top:6px;
    font-size:11.5px;font-weight:600;color:var(--accent);
    background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:2px 8px;border-radius:20px;align-self:flex-start}
  .ficha .f-path{font-size:11px;color:var(--muted);margin-top:7px;font-weight:500}
  .ficha .go{position:absolute;right:12px;top:50%;transform:translateY(-50%);
    color:var(--muted);opacity:.5}

  /* Conmutador de ámbito de búsqueda */
  .scope{display:flex;gap:6px;margin:18px 2px 2px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow-sm)}
  .scope .seg{flex:1;border:none;background:transparent;color:var(--muted);
    font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer;
    padding:9px 10px;border-radius:10px;transition:background .15s,color .15s;
    display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .scope .seg b{font-size:11px;background:var(--line-2);color:var(--muted);
    border-radius:20px;padding:1px 7px;font-weight:700}
  .scope .seg.on{background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#a855f7));
    color:#fff;box-shadow:var(--shadow-sm)}
  .scope .seg.on b{background:rgba(255,255,255,.28);color:#fff}

  .empty{color:var(--muted);text-align:center;padding:56px 22px;font-size:14.5px;
    line-height:1.6}
  .empty .big{font-size:34px;margin-bottom:12px;opacity:.7}

  /* Skeleton de carga */
  .sk{border-radius:var(--radius);min-height:158px;
    background:linear-gradient(100deg,var(--line-2) 30%,var(--card) 50%,var(--line-2) 70%);
    background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  footer{color:var(--muted);font-size:11.5px;text-align:center;padding:30px 16px 40px;
    font-weight:500}
  footer .dot{opacity:.4;margin:0 6px}

  /* ---------- Hoja "Añadir ficha" ---------- */
  .sheet-back{position:fixed;inset:0;z-index:70;background:rgba(12,14,22,.5);
    backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
  .sheet-back.open{display:flex;animation:fade .18s ease}
  .sheet{background:var(--bg);width:100%;max-width:560px;
    border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);
    box-shadow:0 -12px 40px rgba(0,0,0,.28);animation:slideup .26s cubic-bezier(.2,.8,.2,1);
    max-height:88vh;overflow:auto}
  @media (min-width:560px){ .sheet{border-radius:24px;margin-bottom:24px;align-self:center} }
  @keyframes slideup{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .sheet-h{display:flex;align-items:center;margin-bottom:6px}
  .sheet-title{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1}
  .sheet-h button{border:none;background:var(--card);color:var(--muted);width:36px;height:36px;
    border-radius:11px;cursor:pointer;font-size:15px;border:1px solid var(--line)}
  .sheet .step{display:flex;gap:12px;margin-top:16px}
  .sheet .step .n{flex:0 0 auto;width:26px;height:26px;border-radius:9px;
    background:linear-gradient(140deg,#6366f1,#8b5cf6);color:#fff;font-family:var(--display);
    font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
  .sheet .step .tx{font-size:14px;color:var(--ink-soft);line-height:1.5}
  .sheet code{background:var(--card);border:1px solid var(--line);border-radius:7px;
    padding:1px 7px;font-size:13px;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace}
  .up-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:11px}
  .up-btn{display:flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 13px;
    color:var(--ink);font-family:var(--body);font-weight:600;font-size:13.5px;
    box-shadow:var(--shadow-sm);transition:transform .13s,border-color .13s}
  .up-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .up-btn .d{width:26px;height:26px;border-radius:8px;flex:0 0 auto;color:#fff;
    display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
  .up-btn.primary{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));
    background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .sheet .note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.55}
  .sheet .note b{color:var(--ink-soft)}

  /* ---------- Visor PDF ---------- */
  .viewer{position:fixed;inset:0;z-index:80;background:#1a1d27;
    display:none;flex-direction:column}
  .viewer.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .v-bar{display:flex;align-items:center;gap:11px;
    padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;
    background:rgba(16,18,26,.92);backdrop-filter:blur(8px);color:#fff;flex:0 0 auto;
    border-bottom:1px solid rgba(255,255,255,.08)}
  .v-bar .v-title{font-family:var(--display);font-size:14.5px;font-weight:700;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v-bar button, .v-bar a.dl{background:rgba(255,255,255,.12);border:none;color:#fff;
    width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:16px;
    display:grid;place-items:center;flex:0 0 auto;text-decoration:none;
    transition:background .15s}
  .v-bar button:hover, .v-bar a.dl:hover{background:rgba(255,255,255,.24)}
  .v-pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:16px 12px calc(env(safe-area-inset-bottom) + 40px);
    display:flex;flex-direction:column;align-items:center;gap:16px}
  .v-pages canvas{max-width:100%;height:auto;border-radius:8px;
    box-shadow:0 12px 40px rgba(0,0,0,.55);background:#fff}
  .v-loading{color:#c9cdd8;font-size:14.5px;padding:48px 20px;text-align:center;
    font-family:var(--body)}
  .spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.22);
    border-top-color:#fff;border-radius:50%;margin:0 auto 14px;
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .v-loading a{color:#93b4ff}

  @media (max-width:420px){
    .grid.themes{grid-template-columns:repeat(2,1fr);gap:12px}
    .tile{min-height:150px;padding:15px}
    .tile .t-name{font-size:16.5px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo">📚</div>
      <div class="brand-txt">
        <h1>Mis Fichas de Estudio</h1>
        <p id="brandSub">Cargando tu biblioteca…</p>
      </div>
      <button class="add-btn" id="addBtn" title="Añadir ficha">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Añadir</span>
      </button>
    </div>
    <div class="search">
      <svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" placeholder="Buscar en todas las fichas…" autocomplete="off" />
      <button class="clear" id="qClear" aria-label="Borrar búsqueda">✕</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="section-label">Temas</div>
  <div class="grid themes">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<footer>
  <span id="foot"></span>
</footer>

<!-- Hoja: Añadir ficha -->
<div class="sheet-back" id="addBack" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Añadir una ficha">
    <div class="sheet-h">
      <div class="sheet-title">Añadir una ficha</div>
      <button id="addClose" aria-label="Cerrar">✕</button>
    </div>
    <div id="addBody"></div>
  </div>
</div>

<!-- Visor de PDF -->
<div class="viewer" id="viewer" aria-hidden="true">
  <div class="v-bar">
    <button id="vClose" title="Cerrar" aria-label="Cerrar">✕</button>
    <div class="v-title" id="vTitle"></div>
    <a class="dl" id="vOpen" target="_blank" rel="noopener" title="Abrir en pestaña nueva" aria-label="Abrir en pestaña nueva">⇱</a>
  </div>
  <div class="v-pages" id="vPages"></div>
</div>

<script src="assets/pdfjs/pdf.min.js"></script>
<script>
(function(){
  "use strict";

  // Paletas de gradiente vivas (una por tema, estable por nombre)
  const PALETTE = [
    ["#6366f1","#8b5cf6"], // indigo
    ["#ec4899","#f43f5e"], // pink→rose
    ["#0ea5e9","#2563eb"], // sky→blue
    ["#10b981","#059669"], // emerald
    ["#f59e0b","#ea580c"], // amber→orange
    ["#8b5cf6","#d946ef"], // violet→fuchsia
    ["#14b8a6","#0ea5e9"], // teal→sky
    ["#f43f5e","#e11d48"], // rose
    ["#84cc16","#16a34a"], // lime→green
    ["#6366f1","#0ea5e9"], // indigo→sky
  ];
  function hash(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h;}
  function themeColors(name){ return PALETTE[hash(name||"·")%PALETTE.length]; }
  function encPath(p){ return p.split("/").map(encodeURIComponent).join("/"); }
  function monogram(name){ const c=(name||"·").trim(); return (c[0]||"·").toUpperCase(); }

  const DOC_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/></svg>';
  const CHEV = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

  if (window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = "assets/pdfjs/pdf.worker.min.js";
  }

  const state = { data:null, stack:[], scope:null }; // scope: 'folder' | 'global' | null(=auto)
  const main = document.getElementById("main");
  const foot = document.getElementById("foot");
  const brandSub = document.getElementById("brandSub");
  const qInput = document.getElementById("q");
  const qClear = document.getElementById("qClear");

  async function load(){
    try{
      const res = await fetch("data.json?_=" + Date.now(), {cache:"no-cache"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      state.data = await res.json();
      const c = state.data.counts;
      brandSub.textContent = `${c.fichas} ${c.fichas===1?"ficha":"fichas"} · ${c.subtemas} ${c.subtemas===1?"tema":"temas"}`;
      foot.innerHTML = `Se actualiza sola al añadir fichas <span class="dot">•</span> ` +
        new Date(state.data.generatedAt).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
      render();
    }catch(err){
      main.innerHTML = `<div class="empty"><div class="big">📡</div>No se pudieron cargar las fichas.<br><small>${esc(err.message)}</small></div>`;
      brandSub.textContent = "Error de carga";
    }
  }

  function currentNode(){ return state.stack.length ? state.stack[state.stack.length-1] : state.data; }
  function topThemeName(){ return state.stack.length ? state.stack[0].name : null; }

  function updatePlaceholder(){
    const here = state.stack.length ? state.stack[state.stack.length-1].name : null;
    qInput.placeholder = here ? `Buscar en ${here}…` : "Buscar en todas las fichas…";
  }

  function render(){
    updatePlaceholder();
    const q = qInput.value.trim().toLowerCase();
    qClear.classList.toggle("show", !!q);
    if(q){ renderSearch(q); return; }

    const node = currentNode();
    const parts = [];

    parts.push(`<nav class="crumbs">`);
    parts.push(`<button data-nav="0">🏠 Inicio</button>`);
    state.stack.forEach((n,i)=>{
      parts.push(`<span class="sep">›</span>`);
      if(i===state.stack.length-1) parts.push(`<span class="cur">${esc(n.name)}</span>`);
      else parts.push(`<button data-nav="${i+1}">${esc(n.name)}</button>`);
    });
    parts.push(`</nav>`);

    const folders = node.folders || [];
    const fichas = node.fichas || [];

    if(!folders.length && !fichas.length){
      parts.push(`<div class="empty"><div class="big">🗂️</div>Esta carpeta está vacía.<br><small>Añade un PDF aquí en GitHub y aparecerá solo.</small></div>`);
    }

    if(folders.length){
      parts.push(`<div class="section-label">${state.stack.length? "Subtemas":"Temas"}<span class="count-pill">${folders.length}</span></div>`);
      parts.push(`<div class="grid themes">`);
      folders.forEach((f,i)=>{
        const colorName = state.stack.length ? topThemeName() : f.name;
        const [c1,c2] = themeColors(colorName);
        const chips = [];
        if(f.counts.subtemas) chips.push(`<span class="t-chip">${f.counts.subtemas} subtemas</span>`);
        chips.push(`<span class="t-chip">${f.counts.fichas} ${f.counts.fichas===1?"ficha":"fichas"}</span>`);
        parts.push(`
          <button class="tile" data-folder="${i}" style="background:linear-gradient(145deg,${c1},${c2})">
            <span class="blob b1"></span><span class="blob b2"></span>
            <span class="chev">${CHEV}</span>
            <div class="mono">${esc(monogram(f.name))}</div>
            <div>
              <div class="t-name">${esc(f.name)}</div>
              <div class="t-meta">${chips.join("")}</div>
            </div>
          </button>`);
      });
      parts.push(`</div>`);
    }

    if(fichas.length){
      parts.push(`<div class="section-label">Fichas<span class="count-pill">${fichas.length}</span></div>`);
      parts.push(`<div class="grid cards">`);
      fichas.forEach((fi,i)=> parts.push(fichaCard(fi, i, topThemeName() || fi.title)));
      parts.push(`</div>`);
    }

    main.innerHTML = parts.join("");
    bind();
  }

  function fichaCard(fi, idx, colorName){
    const [c1] = themeColors(colorName);
    return `
      <div class="ficha" data-ficha="${idx}" style="--accent:${c1}">
        <div class="ic">${DOC_SVG}</div>
        <div class="body">
          <div class="f-title">${esc(fi.title)}</div>
          ${fi.subtitle?`<div class="f-sub">🗓 ${esc(fi.subtitle)}</div>`:""}
        </div>
        <span class="go">${CHEV}</span>
      </div>`;
  }

  function collect(node, trail, out){
    (node.fichas||[]).forEach(fi=> out.push({fi, trail}));
    (node.folders||[]).forEach(f=> collect(f, trail.concat(f.name), out));
  }
  function renderSearch(q){
    // Índice global con la ruta completa de cada ficha
    const all = []; collect(state.data, [], all);
    const here = state.stack.map(n=>n.name);              // ruta de la carpeta actual
    const inFolder = here.length > 0;
    // Ámbito por defecto: si estás dentro de una carpeta, busca en ella
    const scope = state.scope || (inFolder ? "folder" : "global");

    const inScope = all.filter(({trail})=>{
      if(scope==="global" || !inFolder) return true;
      return here.every((name,i)=> trail[i]===name);      // la ficha cuelga de la carpeta actual
    });
    const hits = inScope.filter(({fi,trail})=>
      (fi.title+" "+fi.subtitle+" "+trail.join(" ")).toLowerCase().includes(q));

    const parts = [];

    // Migas (para saber dónde estás) + conmutador de ámbito
    if(inFolder){
      const hereName = here[here.length-1];
      const nGlobal = all.filter(({fi,trail})=>
        (fi.title+" "+fi.subtitle+" "+trail.join(" ")).toLowerCase().includes(q)).length;
      const nFolder = all.filter(({fi,trail})=>
        here.every((name,i)=>trail[i]===name) &&
        (fi.title+" "+fi.subtitle+" "+trail.join(" ")).toLowerCase().includes(q)).length;
      parts.push(`<div class="scope">
        <button class="seg ${scope==='folder'?'on':''}" data-scope="folder">En ${esc(hereName)} <b>${nFolder}</b></button>
        <button class="seg ${scope==='global'?'on':''}" data-scope="global">En todo <b>${nGlobal}</b></button>
      </div>`);
    }

    parts.push(`<div class="section-label">Resultados<span class="count-pill">${hits.length}</span></div>`);
    if(!hits.length){
      parts.push(`<div class="empty"><div class="big">🔍</div>Sin resultados para “${esc(q)}”.${inFolder&&scope==='folder'?'<br><small>Prueba a buscar “En todo”.</small>':''}</div>`);
    }else{
      parts.push(`<div class="grid cards">`);
      hits.forEach((h,i)=>{
        const [c1] = themeColors(h.trail[0] || h.fi.title);
        parts.push(`
          <div class="ficha" data-search="${i}" style="--accent:${c1}">
            <div class="ic">${DOC_SVG}</div>
            <div class="body">
              <div class="f-title">${esc(h.fi.title)}</div>
              ${h.fi.subtitle?`<div class="f-sub">🗓 ${esc(h.fi.subtitle)}</div>`:""}
              <div class="f-path">${esc(h.trail.join(" › "))}</div>
            </div>
            <span class="go">${CHEV}</span>
          </div>`);
      });
      parts.push(`</div>`);
    }
    main.innerHTML = parts.join("");
    state._hits = hits;
    main.querySelectorAll("[data-scope]").forEach(el=>{
      el.addEventListener("click", ()=>{ state.scope = el.dataset.scope; render(); });
    });
    main.querySelectorAll("[data-search]").forEach(el=>{
      el.addEventListener("click", ()=> openPDF(state._hits[+el.dataset.search].fi));
    });
  }

  function bind(){
    main.querySelectorAll("[data-nav]").forEach(b=>{
      b.addEventListener("click", ()=>{ state.stack = state.stack.slice(0, +b.dataset.nav); state.scope=null; window.scrollTo({top:0}); render(); });
    });
    main.querySelectorAll("[data-folder]").forEach(b=>{
      b.addEventListener("click", ()=>{
        state.stack.push(currentNode().folders[+b.dataset.folder]);
        state.scope=null; window.scrollTo({top:0}); render();
      });
    });
    main.querySelectorAll("[data-ficha]").forEach(b=>{
      b.addEventListener("click", ()=> openPDF(currentNode().fichas[+b.dataset.ficha]));
    });
  }

  let qTimer;
  qInput.addEventListener("input", ()=>{ clearTimeout(qTimer); qTimer=setTimeout(render,110); });
  qClear.addEventListener("click", ()=>{ qInput.value=""; qInput.focus(); render(); });

  // ---------- Visor PDF ----------
  const viewer = document.getElementById("viewer");
  const vPages = document.getElementById("vPages");
  const vTitle = document.getElementById("vTitle");
  const vOpen = document.getElementById("vOpen");
  let renderToken = 0;

  async function openPDF(fi){
    const url = encPath(fi.path);
    vTitle.textContent = fi.title + (fi.subtitle?` · ${fi.subtitle}`:"");
    vOpen.href = url;
    vPages.innerHTML = `<div class="v-loading"><div class="spin"></div>Abriendo ficha…</div>`;
    viewer.classList.add("open");
    viewer.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    const token = ++renderToken;

    if(!window.pdfjsLib){
      vPages.innerHTML = `<div class="v-loading">Abre la ficha en tu visor:<br><br><a href="${url}" target="_blank" rel="noopener">Abrir PDF ⇱</a></div>`;
      return;
    }
    try{
      const pdf = await pdfjsLib.getDocument(url).promise;
      if(token!==renderToken) return;
      vPages.innerHTML = "";
      const dpr = Math.min(2.2, (window.devicePixelRatio||1) * 1.15);
      for(let p=1; p<=pdf.numPages; p++){
        if(token!==renderToken) return;
        const page = await pdf.getPage(p);
        const vw = Math.min(vPages.clientWidth - 24, 900);
        const base = page.getViewport({scale:1});
        const fit = vw / base.width;
        const viewport = page.getViewport({scale: fit * dpr});
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width; canvas.height = viewport.height;
        canvas.style.width = (base.width*fit) + "px";
        const ctx = canvas.getContext("2d");
        vPages.appendChild(canvas);
        await page.render({canvasContext:ctx, viewport}).promise;
      }
    }catch(err){
      if(token!==renderToken) return;
      vPages.innerHTML = `<div class="v-loading">No se pudo mostrar el PDF aquí.<br><br><a href="${url}" target="_blank" rel="noopener">Abrir en pestaña nueva ⇱</a><br><small style="opacity:.7">${esc(err.message)}</small></div>`;
    }
  }
  function closePDF(){
    renderToken++;
    viewer.classList.remove("open");
    viewer.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
    vPages.innerHTML = "";
  }
  document.getElementById("vClose").addEventListener("click", closePDF);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && viewer.classList.contains("open")) closePDF(); });

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  // ---------- Añadir ficha (subida directa a GitHub) ----------
  function repoInfo(){
    const host = location.hostname;
    if(!host.endsWith(".github.io")) return null;      // sólo en la web publicada
    const owner = host.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean);
    const repo = seg.length ? seg[0] : owner + ".github.io";
    return { owner, repo, branch:"main" };
  }
  function uploadURL(folderPath){
    const r = repoInfo(); if(!r) return null;
    const enc = folderPath.split("/").map(encodeURIComponent).join("/");
    return `https://github.com/${r.owner}/${r.repo}/upload/${r.branch}/${enc}`;
  }
  const addBack = document.getElementById("addBack");
  const addBody = document.getElementById("addBody");

  function buildAdd(){
    const r = repoInfo();
    const themes = state.data ? (state.data.folders||[]) : [];
    const here = state.stack.length ? state.stack[state.stack.length-1] : null;

    let html = `
      <div class="step"><div class="n">1</div><div class="tx">
        Nombra el PDF así: <code>Título (fechas).pdf</code><br>
        Ej.: <code>Napoleón (1769–1821).pdf</code>. Las fechas son opcionales.
      </div></div>
      <div class="step"><div class="n">2</div><div class="tx">
        Elige dónde subirlo. Se abre GitHub: arrastra el PDF, escribe un mensaje corto
        y pulsa <b>Commit changes</b>. En ~1 minuto aparece en la app.
      </div></div>`;

    if(r){
      const btn = (name, path, primary)=>{
        const [c1,c2] = themeColors(name);
        return `<a class="up-btn ${primary?'primary':''}" target="_blank" rel="noopener" href="${uploadURL(path)}">
          <span class="d" style="background:linear-gradient(140deg,${c1},${c2})">${esc(monogram(name))}</span>
          <span>${esc(name)}</span></a>`;
      };
      html += `<div style="margin-top:8px">`;
      if(here){
        html += `<div class="up-grid">${btn(topThemeName()||here.name, here.path, true)}</div>
                 <div class="note" style="margin-top:8px">Subir a la carpeta donde estás ahora: <b>${esc(here.name)}</b>. O elige otro tema:</div>`;
      }
      html += `<div class="up-grid">` + themes.map(t=> btn(t.name, t.path, false)).join("") + `</div></div>`;
      html += `<div class="note">
        ¿Un <b>tema o subtema nuevo</b>? En la pantalla de subida de GitHub, antes del nombre del
        archivo escribe la ruta con barras, p. ej. <code>Historia/España/Napoleón (1769–1821).pdf</code>,
        y la carpeta se crea sola.</div>`;
    }else{
      html += `<div class="note">
        Abre tu app publicada (la dirección <code>github.io</code>) para tener aquí los botones de
        subida directa. Mientras, puedes añadir fichas con <b>GitHub Desktop</b>: copia el PDF a su
        carpeta dentro de <code>Temas/</code> → <b>Commit</b> → <b>Push</b>.</div>`;
    }
    addBody.innerHTML = html;
  }
  function openAdd(){ buildAdd(); addBack.classList.add("open"); addBack.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; }
  function closeAdd(){ addBack.classList.remove("open"); addBack.setAttribute("aria-hidden","true"); document.body.style.overflow=""; }
  document.getElementById("addBtn").addEventListener("click", openAdd);
  document.getElementById("addClose").addEventListener("click", closeAdd);
  addBack.addEventListener("click", e=>{ if(e.target===addBack) closeAdd(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && addBack.classList.contains("open")) closeAdd(); });

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }

  load();
})();
</script>
</body>
</html>
